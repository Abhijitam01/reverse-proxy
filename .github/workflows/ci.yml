name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reverse-proxy-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: reverse-proxy-ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  go:
    name: Go — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reverse-proxy-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build ./...
      - run: go test -race ./...

  rust:
    name: Rust — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reverse-proxy-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reverse-proxy-rust
      - run: cargo build --release
      - run: cargo test
